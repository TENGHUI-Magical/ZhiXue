server:
  port: 8080

spring:
  application:
    name: zhixue-server
  datasource:
    # 与 docker-compose.yml / 部署方案 2 节一致；密码为占位，请本地改为真实值
    url: jdbc:mysql://localhost:3306/zhixue?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发期打印 SQL，上线前移除
  global-config:
    db-config:
      # 自增表（sys_user/course 等）统一 auto；业务编号表（knowledge_point/question_bank/
      # student_error_record）在实体上用 @TableId(type = IdType.INPUT) 覆盖，禁止全局 input（避坑清单 D2）
      id-type: auto

# Sa-Token 配置（规划书硬约束：认证只用 Sa-Token）
sa-token:
  token-name: satoken
  timeout: 2592000 # 30 天
  is-concurrent: true # 允许同账号多端登录（学生手机+电脑）
  token-style: uuid

# ============ 内部 AI 服务地址 ============
# zhixue-ai 不对外暴露，仅本服务调用（部署方案 1 节拓扑）
zhixue:
  ai:
    base-url: http://localhost:8000
    timeout-seconds: 10 # 超时触发 60001 降级（接口契约 2.4 节）
