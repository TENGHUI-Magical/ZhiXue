server:
  port: 8080

spring:
  application:
    name: zhixue-server
  # 默认 dev；生产用 SPRING_PROFILES_ACTIVE=prod 启动
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # 手机拍摄错题图片常超过 Spring 默认 1MB
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 自增表（sys_user/course 等）统一 auto；业务编号表（knowledge_point/question_bank/
      # student_error_record）在实体上用 @TableId(type = IdType.INPUT) 覆盖，禁止全局 input（避坑清单 D2）
      id-type: auto

# Sa-Token 配置（规划书硬约束：认证只用 Sa-Token）
sa-token:
  token-name: satoken
  timeout: 2592000 # 30 天
  is-concurrent: true # 允许同账号多端登录（学生手机+电脑）
  token-style: uuid

# ============ 知识点映射参数（契约 05-算法 第 0 节；禁止代码硬编码） ============
mapping:
  # 词法余弦（TF-IDF）与神经向量的量纲差异，用该系数归一到 0—1；接入 bge 后改为 1.0
  score-scale: 0.3
  auto-threshold: 0.60
  margin: 0.10
  confirm-floor: 0.40

# ============ 内部 AI 服务地址 ============
# zhixue-ai 不对外暴露，仅本服务调用（部署方案 1 节拓扑）
zhixue:
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    timeout-seconds: 10 # 首字节超时；整体超时与连接超时见契约 5.2 节
  ocr:
    save-dir: ${OCR_SAVE_DIR:./data/upload}
