server:
  port: 8080

spring:
  application:
    name: zhixue-server
  # 默认 dev；生产用 SPRING_PROFILES_ACTIVE=prod 启动
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # 手机拍摄错题图片常超过 Spring 默认 1MB
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    redis:
      # 限流/缓存故障必须快速失败并降级放行，不能让 SSE 请求等默认 60s 命令超时
      timeout: 500ms
      connect-timeout: 500ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 自增表（sys_user/course 等）统一 auto；业务编号表（knowledge_point/question_bank/
      # student_error_record）在实体上用 @TableId(type = IdType.INPUT) 覆盖，禁止全局 input（避坑清单 D2）
      id-type: auto

# Sa-Token 配置（规划书硬约束：认证只用 Sa-Token）
sa-token:
  token-name: satoken
  timeout: 2592000 # 30 天
  is-concurrent: true # 允许同账号多端登录（学生手机+电脑）
  token-style: uuid

# ============ 知识点映射参数（契约 05-算法 第 0 节；禁止代码硬编码） ============
# 指标口径：离线脚本 tools/eval_mapping_offline.py，两个语料口径必须标 N
# （ch23 → N=20；all → N=60，线上语义）。当前值对应 V2 = 误区入语料。
mapping:
  # 词法余弦（TF-IDF）与神经向量的量纲差异，用该系数归一到 0—1；接入 bge 后改为 1.0
  score-scale: 0.3
  auto-threshold: 0.60
  margin: 0.10
  # 0.40 → 0.35：补偿"误区入语料"导致的余弦整体缩小，覆盖率回到基线以上（见设计文档 §6.2）。
  # 演示前回归：在线人工率 >65% 时把本值改回 0.40 并重启；只改配置，不回滚提交（见 runbook §3.1）。
  confirm-floor: 0.35
  # 唯一打分开关：把 knowledge_point.misconception 纳入语料；置 false 即回退到 V0 行为
  misconception-in-corpus: true

# ============ 掌握度与画像聚合参数（契约 05-算法 §2；禁止代码硬编码） ============
mastery:
  half-life-days: 30    # 证据时间半衰期；到期复习的“遗忘过半”阈值同源于此（05 §3.8）
  min-samples: 3        # 薄弱点最小样本数
  # 实时聚合时间窗（天）：教师端三个全课程聚合与学生画像只扫窗口内记录，
  # 跨学年历史走 learning_portrait_snapshot（me() 快照优先已就位）。
  # 180 = 30 天半衰 × 6，窗口外证据衰减后权重 <1.6%，丢弃不影响口径。
  aggregate-window-days: 180

# ============ 推荐与复习节奏参数（契约 05-算法 §0/§3.3/§3.8；禁止代码硬编码） ============
recommend:
  # 冷却天数（3—14 可调）：近 N 天练过的题不重复推荐、不排进计划；到期复习用它做
  # “刚复习过不出队”的冷却下限。推荐内部的 3 天放宽档是固定梯度，不随本值缩放。
  cooldown-days: 7

# ============ 内部 AI 服务地址 ============
# zhixue-ai 不对外暴露，仅本服务调用（部署方案 1 节拓扑）
zhixue:
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    timeout-seconds: 10 # 首字节超时；整体超时与连接超时见契约 5.2 节
  ocr:
    save-dir: ${OCR_SAVE_DIR:./data/upload}
    max-image-bytes: ${OCR_MAX_IMAGE_BYTES:5242880}  # 5MB（契约 §4）
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:60}      # OCR 整体超时（契约 §3），区别于 SSE 首字节 10s
    reclaim-interval-ms: ${OCR_RECLAIM_INTERVAL_MS:60000} # 超时任务回收器扫描间隔
    image-retention-days: ${OCR_IMAGE_RETENTION_DAYS:30}  # 上传图片保留天数（契约 §4 周清理口径）
    cleanup-cron: ${OCR_CLEANUP_CRON:0 0 3 ? * SUN}       # 过期图片清理 cron（Asia/Shanghai）
