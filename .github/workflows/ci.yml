name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  backend:
    name: 后端编译与测试（Boot 4 / Java 21）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhixue-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify 覆盖多模块编译与单测；@Tag("it") 集成测试由下方 integration job 执行
      - name: Build and test (mvn verify)
        run: mvn -B -ntp verify

  integration:
    name: 集成测试（Testcontainers MySQL/Redis）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhixue-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub runner 自带 Docker；Testcontainers 拉起 MySQL/Redis，AI 用 JDK HttpServer 桩
      - name: Integration tests (mvn -Pit verify)
        run: mvn -B -ntp -Pit verify
        env:
          RUN_IT: 'true'

  frontend:
    name: 前端类型检查与构建（Vue3 / TS）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhixue-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zhixue-web/package-lock.json
      - run: npm ci
      # package.json 的 build 含 vue-tsc 类型检查
      - run: npm run build

  e2e:
    name: 前端 E2E（Playwright + Edge + axe）
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zhixue-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zhixue-web/package-lock.json
      - run: npm ci
      # 脚本自动拉起 Vite（5174），API 全部 mock；Windows runner 自带 Edge
      - name: Run E2E
        run: npm run e2e
        env:
          E2E_OUT: e2e-artifacts
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: zhixue-web/e2e-artifacts/
          if-no-files-found: warn

  ai:
    name: AI 服务 lint 与单测（FastAPI）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhixue-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: zhixue-ai/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      # 只查语法错误(E9)与未定义名(F)，不没收风格；规范加严需先过项目内讨论
      - name: Lint (E9/F)
        run: ruff check app tests
      - name: Byte-compile
        run: python -m compileall -q app
      - name: Unit tests
        run: python -m pytest -q
