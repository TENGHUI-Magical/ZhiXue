<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <script>
      // 首屏前应用主题，避免暗色主题闪白；key 与 useTheme.ts 保持一致
      try {
        var theme = localStorage.getItem('zhixue-theme');
        if (theme === 'ink') {
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.add('dark');
        } else if (theme) {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
    <title>智学领航：高校课程学情诊断系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
