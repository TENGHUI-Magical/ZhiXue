      type: object
      required: [logId, kpId, errorType]
      properties:
        logId: { type: string, example: EL_101 }
        kpId: { type: string, example: KP0201 }
        errorType:
          type: string
          enum: [CONCEPT_CONFUSION, METHOD_MISSING, STEP_OMISSION, CALCULATION_ERROR, BOUNDARY_ERROR]
        questionText: { type: string, nullable: true }
        forceRefresh: { type: boolean, default: false }
