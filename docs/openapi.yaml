        courseId: { type: integer, format: int64 }
        primaryKpId: { type: string }
        questionType: { type: string, enum: [单选, 多选, 填空, 简答, 编程] }
        questionText: { type: string }
        options:
          type: array
          items: { type: string }
          nullable: true
        answerText: { type: string, nullable: true }
        analysisText: { type: string, nullable: true }
        difficulty: { type: integer, minimum: 1, maximum: 3 }
        source: { type: string, nullable: true }
        variantHint: { type: string, nullable: true }
    ImportResultResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ImportResult' }
    ImportResult:
      type: object
      properties:
        total: { type: integer }
        inserted: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }
