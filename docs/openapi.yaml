openapi: 3.1.0
info:
  title: 智学领航 API
  version: 2.2.7
  description: |
    高校课程学情诊断系统接口契约 V2（唯一机器可读源）。
    人读语义、状态机与降级规则见 docs/01-接口契约V2.md；本文档只定义结构与字段，不重复业务解释。
    约定：
    - 所有路径以 /api 开头，JSON 字段 camelCase。
    - 时间统一 Asia/Shanghai，格式 yyyy-MM-dd HH:mm:ss；日期 yyyy-MM-dd。
    - 除登录与健康检查外，全部需要 header `satoken`。
    - 幂等：上传、作答提交、打卡必须携带 clientToken。
    - 错误约定：业务错误（40000/40100/40300/40400/40900/42900/60001 等）一律返回
      HTTP 200 + `code`≠0 的统一信封，不返回 HTTP 4xx/5xx；错误码语义见 docs/01 §1.2。
      因此本契约不在 paths 中声明 4xx/5xx 响应，错误码目录见 components.responses。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发（Windows 下用 127.0.0.1，不要用 localhost）
tags:
  - name: auth
  - name: course
  - name: question
  - name: error
  - name: diagnosis
  - name: recommend
  - name: practice
  - name: portrait
  - name: plan
  - name: teacher
  - name: system
security:
  - SaToken: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 50 }
                password: { type: string, minLength: 6, maxLength: 64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前用户信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
  /api/courses:
    get:
      tags: [course]
      summary: 课程列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseListResponse' }
  /api/courses/{courseId}/chapters:
    get:
      tags: [course]
      summary: 章节列表（按 chapterNo 升序）
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterListResponse' }
  /api/courses/{courseId}/knowledge-graph:
    get:
      tags: [course]
      summary: 知识图谱（节点 + 先修边）
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphResponse' }
  /api/course/kp/{kpId}:
    get:
      tags: [course]
      summary: 知识点详情
      parameters:
        - name: kpId
          in: path
          required: true
          schema: { type: string, example: KP0201 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpResponse' }
  /api/questions:
    get:
      tags: [question]
      summary: 按知识点列出题目（不含答案与解析；供错题关联/练习选择）
      parameters:
        - name: kpId
          in: query
          required: true
          schema: { type: string, example: KP0201 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionBriefListResponse' }
  /api/questions/{qId}:
    get:
      tags: [question]
      summary: 题目详情（不含答案与解析；学生先独立作答）
      parameters:
        - name: qId
          in: path
          required: true
          schema: { type: string, example: Q_0201 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetailResponse' }
  /api/questions/{qId}/answer:
    get:
      tags: [question]
      summary: 查看参考答案与解析（学生点击“查看答案”后显式调用）
      parameters:
        - name: qId
          in: path
          required: true
          schema: { type: string, example: Q_0201 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionAnswerResponse' }
  /api/error/upload:
    post:
      tags: [error]
      summary: 上传错题图片，创建 OCR 任务
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, clientToken]
              properties:
                file: { type: string, format: binary }
                clientToken: { type: string, maxLength: 64 }
      responses:
        '200':
          description: 任务已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrAcceptedResponse' }
  /api/error/tasks/{taskId}:
    get:
      tags: [error]
      summary: 查询 OCR 任务状态
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, example: '9f2c1d7e8a4b4c1e9d3f0a6b5c7e8f90' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrTaskResponse' }
  /api/error/records:
    post:
      tags: [error]
      summary: 创建错题记录（DRAFT）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorRecordCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorRecordResponse' }
    get:
      tags: [error]
      summary: 错题列表（分页）
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
        - name: kpId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, CONFIRMED] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorRecordPageResponse' }
  /api/error/records/{logId}:
    get:
      tags: [error]
      summary: 错题详情
      parameters:
        - $ref: '#/components/parameters/LogId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorRecordResponse' }
  /api/error/records/{logId}/confirm:
    put:
      tags: [error]
      summary: 确认错题（DRAFT → CONFIRMED，触发映射与推荐）
      parameters:
        - $ref: '#/components/parameters/LogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kpId, errorType]
              properties:
                kpId: { type: string, example: KP0201 }
                errorType:
                  type: string
                  enum: [CONCEPT_CONFUSION, METHOD_MISSING, STEP_OMISSION, CALCULATION_ERROR, BOUNDARY_ERROR]
                correctedText: { type: string, maxLength: 2000 }
                studentNote: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorRecordResponse' }
  /api/diagnosis/map:
    post:
      tags: [diagnosis]
      summary: 知识点映射（三通道）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, courseId]
              properties:
                text: { type: string, maxLength: 3000 }
                courseId: { type: integer, format: int64 }
                chapterId: { type: integer, format: int64, nullable: true }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapResponse' }
  /api/diagnosis/explain:
    post:
      tags: [diagnosis]
      summary: 生成启发式讲解（SSE）
      description: |
        返回 text/event-stream。事件类型：meta / delta / source / degraded / done / error，详见契约文档第 5 节。
        超时：连接 3s、首字节 10s、整体 60s；服务端每 15s 发送 `: heartbeat`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧序列，按 `\n\n` 切帧
  /api/diagnosis/explain/{explainId}:
    get:
      tags: [diagnosis]
      summary: 查询讲解记录（用于刷新恢复）
      parameters:
        - name: explainId
          in: path
          required: true
          schema: { type: string, example: EX_20261024_0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplainLogResponse' }
  /api/recommendations:
    get:
      tags: [recommend]
      summary: 某条错题的三层推荐
      parameters:
        - name: logId
          in: query
          required: false
          description: 错题记录编号，优先使用；与 kpId 至少提供一个。
          schema: { type: string, example: EL_101 }
        - name: kpId
          in: query
          required: false
          description: 无 logId 时的兜底知识点过滤（竖切阶段）；与 logId 至少提供一个。
          schema: { type: string, example: KP0201 }
        - name: courseId
          in: query
          required: false
          description: 课程 ID；缺省时按 logId/kpId 解析知识点所属课程；与解析结果不一致返回 40000。
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationListResponse' }
  /api/practices:
    post:
      tags: [practice]
      summary: 提交作答（推荐题/自主练习；计划内作答走 /api/plans/{planId}/checkin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeResponse' }
  /api/portraits/me:
    get:
      tags: [portrait]
      summary: 当前学生画像（实时聚合）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortraitResponse' }
  /api/portraits/class/{courseId}:
    get:
      tags: [portrait]
      summary: 班级画像总览（教师）
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassPortraitResponse' }
  /api/plans:
    get:
      tags: [plan]
      summary: 学习计划列表（按日期区间，周视图 = 7 条日计划）
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanListResponse' }
  /api/plans/due-reviews:
    get:
      tags: [plan]
      summary: 到期复习队列（05 §3.8：距上次答对已过半衰期且冷却外的知识点，附建议重做的题与可解释理由）
      parameters:
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueReviewListResponse' }
  /api/plans/generate:
    post:
      tags: [plan]
      summary: 生成一周计划（7 条日计划 + 明细题）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, weekStart]
              properties:
                courseId: { type: integer, format: int64 }
                weekStart: { type: string, format: date, example: '2026-11-02' }
                dailyQuestionCount: { type: integer, minimum: 3, maximum: 5, default: 3 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanListResponse' }
  /api/plans/{planId}/checkin:
    post:
      tags: [plan]
      summary: 打卡（完成一道计划题；支持“已作答”与“仅记录进度”）
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qId, clientToken, answered]
              properties:
                qId: { type: string }
                clientToken: { type: string, maxLength: 64 }
                answered:
                  type: boolean
                  description: 是否已完成作答；false = 仅记录进度（不计正确率/不入可信闭环）
                myAnswer: { type: string, nullable: true, maxLength: 20000, description: answered=true 时必填 }
                isCorrect:
                  type: boolean
                  nullable: true
                  description: 客观题可不传（服务端按 answerText 判分并忽略）；主观题必填自评
                costSeconds: { type: integer, nullable: true, minimum: 0, maximum: 86400 }
                errorType:
                  type: [string, "null"]
                  nullable: true
                  enum: [CONCEPT_CONFUSION, METHOD_MISSING, STEP_OMISSION, CALCULATION_ERROR, BOUNDARY_ERROR, UNCLASSIFIED, null]
                  description: 主观题自评错因；未选或客观题由服务端推断，无法归类落 UNCLASSIFIED
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 成功（业务错误仍 HTTP 200 + code≠0）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResponse' }
  /api/teacher/reviews:
    get:
      tags: [teacher]
      summary: 评阅队列（教师；支持状态/知识点/时间筛选）
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, REVIEWED, ALL], default: PENDING }
        - name: kpId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueueResponse' }
  /api/teacher/reviews/{logPk}:
    post:
      tags: [teacher]
      summary: 提交评阅（教师）
      parameters:
        - name: logPk
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, comment]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
                result:
                  type: string
                  enum: [PASS, RETURN]
                  default: PASS
                  description: 评阅结论；RETURN 时必须填写评语
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /api/teacher/students:
    get:
      tags: [teacher]
      summary: 课程学生列表（教师，聚合；C12）
      parameters:
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: sort
          in: query
          schema: { type: string, enum: [lastActiveDesc, masteryAsc, practiceDesc], default: lastActiveDesc }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherStudentPageResponse' }
  /api/teacher/students/{userId}/learning-records:
    get:
      tags: [teacher]
      summary: 单个学生学习记录详情（教师；C12）
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLearningRecordResponse' }
  /api/system/health:
    get:
      tags: [system]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
components:
  securitySchemes:
    SaToken:
      type: apiKey
      in: header
      name: satoken
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: integer, format: int64, example: 1 }
    LogId:
      name: logId
      in: path
      required: true
      schema: { type: string, example: EL_101 }
  responses:
    BadRequest:
      description: 参数校验失败（HTTP 200，body.code=40000）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或 token 过期（HTTP 200，body.code=40100）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 无权限（HTTP 200，body.code=40300）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 资源不存在（HTTP 200，body.code=40400）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 重复提交或状态冲突（HTTP 200，body.code=40900）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        timestamp: { type: integer, format: int64, example: 1792838400000 }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            code: { type: integer, example: 40000 }
            message: { type: string, example: 参数校验失败 }
            data: { type: 'null' }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/LoginResult' }
    LoginResult:
      type: object
      required: [token, userId, role]
      properties:
        token: { type: string }
        userId: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [STUDENT, TEACHER] }
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserInfo' }
    UserInfo:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        realName: { type: string }
        role: { type: string, enum: [STUDENT, TEACHER] }
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { type: 'null' }
    CheckinResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                planId: { type: integer, format: int64 }
                qId: { type: string }
                doneCount: { type: integer }
                planCount: { type: integer }
                verified: { type: boolean, description: 是否计入可信闭环（answered=true 才为 true） }
                isCorrect: { type: boolean, nullable: true }
                gradingMode:
                  type: [string, "null"]
                  enum: [AUTO, SELF]
                  description: AUTO=客观题服务端判分；SELF=主观题自评；answered=false 时为 null
                practiceId: { type: integer, format: int64, nullable: true }
                duplicate: { type: boolean }
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Health' }
    Health:
      type: object
      properties:
        status: { type: string, example: UP }
        db: { type: string, example: UP }
        redis: { type: string, example: DEGRADED }
        ai: { type: string, example: UP }
    CourseListResponse:
