# 智学领航 · 基础设施编排（部署方案 2 节）
# 规划书决策：只容器化基础设施（MySQL/Redis），三个应用本地直跑，降低 4 人团队环境管理成本
services:
  mysql:
    image: mysql:8.0
    container_name: zhixue-mysql
    environment:
      # 仅本地开发可依赖默认值；生产/联调必须在 .env 或环境中注入强口令
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: zhixue                  # 首次启动自动建库；表结构由 init-v2.sql 建（含 V2.1）
      TZ: Asia/Shanghai
    ports:
      # 只绑定回环地址，避免局域网其他主机直连数据库
      - "127.0.0.1:3306:3306"                 # 本机已占用 MySQL 时改 127.0.0.1:3307:3306
    volumes:
      - ./data/mysql:/var/lib/mysql           # 数据持久化（备份见部署方案 5 节）
      # 首次启动按文件名顺序执行；已有 data/mysql 时不会重跑，改数据需先清空数据卷
      - ./zhixue-server/sql/init-v2.sql:/docker-entrypoint-initdb.d/01-init-v2.sql:ro
      - ./zhixue-server/sql/seed-kp-ch02-ch03.sql:/docker-entrypoint-initdb.d/02-seed-kp.sql:ro
      - ./zhixue-server/sql/seed-question-ch02-ch03.sql:/docker-entrypoint-initdb.d/03-seed-question.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: zhixue-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data

# 说明：zhixue-ai 的向量索引（numpy）与上传图片持久化在其自身 data/ 目录（非容器），
#       三资产统一位于 data/ 下，备份直接打包该目录（部署方案 5 节）